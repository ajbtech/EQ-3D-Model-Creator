name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Smoke-run the end-to-end synthetic spike too (it asserts + exits non-zero on failure).
      - run: npm run spike
      # Prove the production bundle still builds (catches import/resolution breakage).
      - run: npm run build
